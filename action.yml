name: Axon Shaft
description: "Review pull requests with Claude, on your own runners. The repo needs a project on shaft.axonpack.dev, and the workflow needs `permissions: id-token: write`."
author: axonpack

inputs:
  dry_run:
    description: Print the summary and inline comments to the job log instead of posting them.
    required: false
    default: "false"

outputs:
  verdict:
    description: blocking, needs-changes or looks-good.
  findings:
    description: The number of blocking and should-fix findings.
  summary_url:
    description: The link to the summary comment. Empty on a dry run.

runs:
  using: node24
  main: dist/index.js
