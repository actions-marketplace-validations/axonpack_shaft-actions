name: Axon Shaft
description: Review pull requests with Claude on your own runners, with settings from shaft.axonpack.dev.
author: axonpack
branding:
  icon: check-circle
  color: blue

inputs:
  dry_run:
    description: Print the summary and inline comments to the job log instead of posting them.
    required: false
    default: "false"

outputs:
  verdict:
    description: blocking, needs-changes or looks-good.
  findings:
    description: The number of blocking and should-fix findings.
  summary_url:
    description: The link to the summary comment. Empty on a dry run.

runs:
  using: node24
  main: dist/index.js
  # At the end of the job, even after a cancel: closes any check run the main step left in progress.
  post: dist/post.js
  post-if: always()
